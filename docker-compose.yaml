services:
  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.0-alpine
    restart: unless-stopped
    env_file:
      - .env

  minio:
    image: quay.io/minio/minio:RELEASE.2023-09-07T02-05-02Z
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9090"
    env_file:
      - .env
    volumes:
      - ./data/minio:/data

volumes:
  postgres_data: