services:
  postgres:
    ports:
      - "5434:5432"

  # Publish Redis to the host so the API running locally (pnpm start:dev)
  # can reach it at localhost:6379 — matches REDIS_IP/REDIS_PORT in .env.
  redis:
    ports:
      - "6379:6379"

  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    ports:
      - "5540:5540"
    volumes:
      - redis-insight_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    ports:
      - "9000:9000"
      - "9090:9090"

volumes:
  redis-insight_data: